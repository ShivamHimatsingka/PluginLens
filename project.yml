name: PluginLens
options:
  bundleIdPrefix: dev.pluginlens
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: NO
  configs:
    Debug:
      ONLY_ACTIVE_ARCH: YES
    Release:
      ONLY_ACTIVE_ARCH: NO
      ARCHS: "arm64 x86_64"
targets:
  PluginLens:
    type: application
    platform: macOS
    sources: [Sources/PluginLens]
    info:
      path: Sources/PluginLens/Info.plist
      properties:
        CFBundleName: Plugin Lens
        CFBundleDisplayName: Plugin Lens
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.music
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.pluginlens.PluginLens
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
  PluginLensTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/PluginLensTests
      - path: Tests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: PluginLens
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.pluginlens.PluginLensTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PluginLens:
    build:
      targets:
        PluginLens: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [PluginLensTests]
